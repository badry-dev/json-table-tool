[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv", "__pycache__"]
# Only lint/format Python sources; prose files carry illustrative snippets that
# must stay byte-identical to what they document.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Long URLs and prose in docstrings/comments are allowed; code lines are still
    # held to line-length by the formatter.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
