<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>JSON &rarr; Table Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">{ }</div>
                <h1>JSON <span>&rarr;</span> Table</h1>
            </div>
            <p class="subtitle">Convert JSON to tables instantly. No data stored.</p>
        </header>

        <!-- Input Section -->
        <div class="card">
            <div class="card-title">Input Source</div>

            <div class="method-tabs">
                <button class="method-tab active" data-method="file">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Upload File
                </button>
                <button class="method-tab" data-method="paste">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    Paste JSON
                </button>
                <button class="method-tab" data-method="api">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                    </svg>
                    Fetch from API
                </button>
            </div>

            <form id="jsonForm">
                <input type="hidden" name="input_method" id="inputMethod" value="file">

                <!-- Data Format Selector -->
                <div class="form-group format-selector">
                    <label>Data Format</label>
                    <div class="format-toggle">
                        <button type="button" class="format-btn active" data-format="json">JSON</button>
                        <button type="button" class="format-btn" data-format="jsonl">JSONL</button>
                    </div>
                    <input type="hidden" name="data_format" id="dataFormat" value="json">
                </div>

                <!-- File Upload Panel -->
                <div class="method-panel active" data-panel="file">
                    <div class="file-upload" id="fileUpload">
                        <input type="file" name="json_file" id="jsonFile" accept=".json,.jsonl,application/json">
                        <svg class="file-upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <div class="file-upload-text">Drop your JSON or JSONL file here or click to browse</div>
                        <div class="file-upload-hint">Supports .json and .jsonl files up to 10MB</div>
                        <div class="file-name" id="fileName"></div>
                    </div>
                </div>

                <!-- Paste JSON Panel -->
                <div class="method-panel" data-panel="paste">
                    <div class="form-group">
                        <label for="pastedJson">Paste your JSON or JSONL</label>
                        <textarea name="pasted_json" id="pastedJson" placeholder='{"data": [{"id": 1, "name": "Example"}]}'></textarea>
                    </div>
                </div>

                <!-- API Fetch Panel -->
                <div class="method-panel" data-panel="api">
                    <div class="form-group">
                        <label for="apiUrl">API Endpoint URL</label>
                        <input type="url" name="api_url" id="apiUrl" placeholder="https://api.example.com/data">
                    </div>

                    <div class="form-group">
                        <label for="authMethod">Authentication Method</label>
                        <select name="auth_method" id="authMethod">
                            <option value="none">No Authentication</option>
                            <option value="api_key">API Key (Header)</option>
                            <option value="basic">Basic Authentication</option>
                            <option value="bearer">Bearer Token</option>
                            <option value="query_param">Query Parameter Token</option>
                        </select>
                    </div>

                    <!-- API Key Auth -->
                    <div class="auth-options" data-auth="api_key">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="apiKeyHeader">Header Name</label>
                                <input type="text" name="api_key_header" id="apiKeyHeader" value="X-API-Key" placeholder="X-API-Key">
                            </div>
                            <div class="form-group">
                                <label for="apiKey">API Key</label>
                                <input type="password" name="api_key" id="apiKey" placeholder="Your API key">
                            </div>
                        </div>
                    </div>

                    <!-- Basic Auth -->
                    <div class="auth-options" data-auth="basic">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="basicUsername">Username</label>
                                <input type="text" name="basic_username" id="basicUsername" placeholder="Username">
                            </div>
                            <div class="form-group">
                                <label for="basicPassword">Password</label>
                                <input type="password" name="basic_password" id="basicPassword" placeholder="Password">
                            </div>
                        </div>
                    </div>

                    <!-- Bearer Token -->
                    <div class="auth-options" data-auth="bearer">
                        <div class="form-group">
                            <label for="bearerToken">Bearer Token</label>
                            <input type="password" name="bearer_token" id="bearerToken" placeholder="Your bearer token">
                        </div>
                    </div>

                    <!-- Query Param -->
                    <div class="auth-options" data-auth="query_param">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="queryParamName">Parameter Name</label>
                                <input type="text" name="query_param_name" id="queryParamName" value="api_key" placeholder="api_key">
                            </div>
                            <div class="form-group">
                                <label for="queryParamValue">Parameter Value</label>
                                <input type="password" name="query_param_value" id="queryParamValue" placeholder="Your token value">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary" id="processBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        Convert to Table
                    </button>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <span>Processing...</span>
                    </div>
                </div>

                <div class="error" id="error">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="errorText"></span>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div class="card results" id="results">
            <div class="results-header">
                <div class="results-info">
                    <div class="card-title mb-0">Results</div>
                    <div class="results-badge success" id="rowCount">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                        <span id="rowCountText">0 rows</span>
                    </div>
                    <div class="results-badge" id="previewBadge">
                        Showing first 25
                    </div>
                </div>
                <button class="btn btn-export" id="exportBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Export CSV
                </button>
            </div>
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <footer>
            <p>Data is processed in-memory only. Nothing is stored. <a href="#" id="aboutLink">About</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
