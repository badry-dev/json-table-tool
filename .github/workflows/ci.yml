name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests
        run: python -m pytest tests/ -v

      - name: Client-side export assertions (F1)
        run: node tests/js/test_export_sanitize.mjs

      - name: Client-side render/cap assertions (P4/P5/P13)
        run: node tests/js/test_render_caps.mjs

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
