# render.yaml - Render Blueprint specification
# This file defines the service configuration for Render deployment

services:
  - type: web
    name: json-table-converter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.5
      - key: SECRET_KEY
        generateValue: true
    # Free tier settings
    plan: free
    # No persistent disk = no data storage
    # Auto-deploy on push, but only once CI checks pass. Render blocks the
    # deploy when the commit has failing checks or no checks at all.
    autoDeployTrigger: checksPass
